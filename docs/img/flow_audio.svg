<svg class="flow" role="img" aria-label="Read in grains → Low cut → Soften the highs → Ring modulator → Distortion → Cut the lows → Smooth level wobble → Bitcrusher → Swap left / right → Short reflections, flanger → Left / right offset → Chorus → Vibrato → DJ filter → Echo → Level match → Hiss → Gate" viewBox="0 0 700 864" xmlns="http://www.w3.org/2000/svg" style="width:100%;font-family:'BIZ UDPGothic','Yu Gothic',sans-serif"><defs><marker id="ah" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0.8 L8,4 L0,7.2 z" fill="#1c2028"/></marker></defs><text x="324.0" y="16.0" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Paired video effect / control</text><line x1="324.0" y1="20.0" x2="680.0" y2="20.0" stroke="#b9b6ae" stroke-width="0.8"/><rect x="90.0" y="26.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="41.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Read in grains</text><line x1="294.0" y1="37.0" x2="318.0" y2="37.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="40.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Key (Hue rotate, VHS and Disc wow, key knob)</text><line x1="190.0" y1="48.0" x2="190.0" y2="68.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="68.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="83.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Low cut</text><line x1="190.0" y1="90.0" x2="190.0" y2="110.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="110.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="125.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Soften the highs</text><line x1="294.0" y1="121.0" x2="318.0" y2="121.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="124.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Tint</text><line x1="190.0" y1="132.0" x2="190.0" y2="152.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="152.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="167.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Ring modulator</text><line x1="294.0" y1="163.0" x2="318.0" y2="163.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="166.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Invert</text><line x1="190.0" y1="174.0" x2="190.0" y2="194.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="194.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="209.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Distortion</text><line x1="294.0" y1="205.0" x2="318.0" y2="205.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="208.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Threshold</text><line x1="190.0" y1="216.0" x2="190.0" y2="236.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="236.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="251.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Cut the lows</text><line x1="294.0" y1="247.0" x2="318.0" y2="247.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="250.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Line art</text><line x1="190.0" y1="258.0" x2="190.0" y2="278.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="278.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="293.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Smooth level wobble<