"/><text x="190.0" y="461.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Left / right offset</text><line x1="294.0" y1="457.0" x2="318.0" y2="457.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="460.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Shift RGB</text><line x1="190.0" y1="468.0" x2="190.0" y2="488.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="488.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="503.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Chorus</text><line x1="294.0" y1="499.0" x2="318.0" y2="499.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="502.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Kaleidoscope</text><line x1="190.0" y1="510.0" x2="190.0" y2="530.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="530.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="545.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Vibrato</text><line x1="294.0" y1="541.0" x2="318.0" y2="541.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="544.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Fader (picture: raster wave)</text><line x1="190.0" y1="552.0" x2="190.0" y2="572.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="572.0" width="200.0" height="22.0" fill="#ffffff" stroke="#a8432a" stroke-width="1"/><text x="190.0" y="587.1" font-size="11.5" font-weight="400" fill="#a8432a" text-anchor="middle">DJ filter</text><line x1="294.0" y1="583.0" x2="318.0" y2="583.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="586.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Cutoff, resonance, Morph knobs</text><line x1="190.0" y1="594.0" x2="190.0" y2="614.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="614.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="629.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Echo</text><line x1="294.0" y1="625.0" x2="318.0" y2="625.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="628.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Trails / fader</text><line x1="190.0" y1="636.0" x2="190.0" y2="656.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="656.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="671.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Level match</text><line x1="294.0" y1="667.0" x2="318.0" y2="667.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="670.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Undoes the level change of the echo, bitcrusher, etc.</text><line x1="190.0" y1="678.0" x2="190.0" y2="698.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="698.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="713.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Hiss</text><line x1="294.0" y1="709.0" x2="318.0" y2="709.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="712.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">VHS</text><line x1="190.0" y1="720.0" x2="190.0" y2="740.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><rect x="90.0" y="740.0" width="200.0" height="22.0" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="190.0" y="755.1" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Gate</text><line x1="294.0" y1="751.0" x2="318.0" y2="751.0" stroke="#b9b6ae" stroke-width="0.8"/><text x="324.0" y="754.4" font-size="9.5" font-weight="400" fill="#6b6f76" text-anchor="start">Strobe</text><line x1="190.0" y1="762.0" x2="190.0" y2="773.0" stroke="#1c2028" stroke-width="1"/><circle cx="190" cy="776" r="3" fill="#1c2028"/><text x="180.0" y="780.0" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="end">Recording output (ch 3/4)</text><line x1="190.0" y1="776.0" x2="190.0" y2="797.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><polygon points="179.0,798.0 201.0,798.0 190.0,815.6" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="209.0" y="809.0" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="start">Crossfader</text><line x1="190.0" y1="815.6" x2="190.0" y2="838.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><text x="190.0" y="852.0" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">Master (ch 1/2)</text><polyline points="190.0,776.0 364.0,776.0 364.0,797.0" fill="none" stroke="#1c2028" stroke-width="1" stroke-linejoin="miter" marker-end="url(#ah)"/><polygon points="353.0,798.0 375.0,798.0 364.0,815.6" fill="#ffffff" stroke="#1c2028" stroke-width="1"/><text x="383.0" y="809.0" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="start">Headphone Cue</text><line x1="364.0" y1="815.6" x2="364.0" y2="838.0" stroke="#1c2028" stroke-width="1" marker-end="url(#ah)"/><text x="364.0" y="852.0" font-size="11.5" font-weight="400" fill="#1c2028" text-anchor="middle">ch 5/6</text></svg>